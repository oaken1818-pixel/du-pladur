services:
  # ─── Backend API ────────────────────────────────────────────────────────
  - type: web
    name: du-pladur-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: du-pladur-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://proj-eduardo.github.io

  # ─── Base de Dados PostgreSQL ────────────────────────────────────────────
databases:
  - name: du-pladur-db
    plan: free
    databaseName: du_pladur
